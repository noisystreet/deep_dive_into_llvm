name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check RST syntax
        run: bash scripts/precommit-check.sh

      - name: Build HTML
        run: make html SPHINXOPTS="-W"  # -W 将警告视为错误

  verify-mlir-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MLIR tools
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y mlir-18-tools
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          mlir-opt-18 --version

      - name: Verify MLIR examples
        run: bash scripts/verify-mlir-examples.sh
